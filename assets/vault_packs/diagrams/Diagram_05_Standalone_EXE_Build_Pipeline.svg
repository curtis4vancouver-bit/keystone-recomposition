<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#04070d" />
  <rect x="15" y="15" width="1170" height="645" rx="16" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.85" />
  <rect x="18" y="18" width="1164" height="639" rx="14" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" />

  <!-- Top Header Banner -->
  <rect x="35" y="30" width="1130" height="85" rx="12" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="1.5" />
  <rect x="50" y="42" width="220" height="24" rx="12" fill="rgba(212,175,55,0.15)" stroke="#d4af37" stroke-width="1" />
  <text x="160" y="58" fill="#d4af37" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">TIER 03 // $800.00 USD FLAGSHIP</text>
  <text x="50" y="92" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Standalone Windows .EXE Compilation &amp; Packaging Pipeline</text>
  <text x="1150" y="78" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="end">From Antigravity Project to Single Standalone Binary</text>

  <!-- 4 Step Pipeline Cards -->
  <!-- Step 1 -->
  <rect x="35" y="135" width="265" height="505" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="50" y="150" width="110" height="22" rx="11" fill="rgba(56,189,248,0.18)" />
  <text x="105" y="165" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">STEP 01 // SETUP</text>
  <text x="50" y="195" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Scaffold &amp; Toolchain</text>
  <text x="50" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Prerequisite Tooling</text>

  <rect x="45" y="235" width="245" height="120" rx="8" fill="#0b111e" stroke="#d4af37" stroke-width="1" />
  <text x="55" y="258" fill="#d4af37" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Required Toolchain</text>
  <text x="55" y="278" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Rust &amp; Cargo (rust-lang.org)</text>
  <text x="55" y="296" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Visual Studio C++ Build Tools</text>
  <text x="55" y="314" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10">• Node.js LTS (v18+ or v20+)</text>
  <text x="55" y="332" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Microsoft Edge WebView2</text>

  <rect x="45" y="370" width="245" height="250" rx="8" fill="#0b111e" stroke="#38bdf8" stroke-width="1" />
  <text x="55" y="393" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Starter Project Files</text>
  <text x="55" y="415" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• package.json (@tauri-apps/cli)</text>
  <text x="55" y="433" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• src-tauri/Cargo.toml (Tauri v2)</text>
  <text x="55" y="451" fill="#d4af37" font-family="system-ui, sans-serif" font-size="10">• src-tauri/tauri.conf.json</text>
  <text x="55" y="469" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• src-tauri/capabilities/default.json</text>
  <text x="55" y="487" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• src/index.html &amp; styles.css</text>
  <text x="55" y="515" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">One-command dependency check:</text>
  <text x="55" y="535" fill="#38bdf8" font-family="monospace" font-size="10">npm install</text>
  <text x="55" y="555" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">Extracts starter in &lt;10 seconds</text>

  <!-- Step 2 -->
  <rect x="325" y="135" width="265" height="505" rx="14" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="1.8" />
  <rect x="340" y="150" width="110" height="22" rx="11" fill="rgba(212,175,55,0.18)" />
  <text x="395" y="165" fill="#d4af37" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">STEP 02 // DEV</text>
  <text x="340" y="195" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Live Development</text>
  <text x="340" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Fast Feedback Loop</text>

  <rect x="335" y="235" width="245" height="120" rx="8" fill="#0b111e" stroke="#38bdf8" stroke-width="1" />
  <text x="345" y="258" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Live Development Command</text>
  <text x="345" y="280" fill="#38bdf8" font-family="monospace" font-size="11">npm run tauri dev</text>
  <text x="345" y="300" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Launches native Windows window</text>
  <text x="345" y="318" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Real-time hot reloading of UI</text>
  <text x="345" y="336" fill="#d4af37" font-family="system-ui, sans-serif" font-size="10">• Rust compiler prints IPC logs</text>

  <rect x="335" y="370" width="245" height="250" rx="8" fill="#0b111e" stroke="#d4af37" stroke-width="1" />
  <text x="345" y="393" fill="#d4af37" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Antigravity Pairing</text>
  <text x="345" y="415" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Open project in Antigravity</text>
  <text x="345" y="433" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Use prompt: "Add a new button"</text>
  <text x="345" y="451" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10">• Antigravity edits app.js and</text>
  <text x="345" y="469" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">  main.rs simultaneously</text>
  <text x="345" y="487" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Live window updates instantly</text>
  <text x="345" y="515" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Zero manual wiring needed</text>
  <text x="345" y="535" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">Full pair-programming with</text>
  <text x="345" y="555" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">Google Antigravity frontier AI.</text>

  <!-- Step 3 -->
  <rect x="615" y="135" width="265" height="505" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="630" y="150" width="110" height="22" rx="11" fill="rgba(56,189,248,0.18)" />
  <text x="685" y="165" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">STEP 03 // BUILD</text>
  <text x="630" y="195" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Release Optimization</text>
  <text x="630" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Production Rust Compiler</text>

  <rect x="625" y="235" width="245" height="120" rx="8" fill="#0b111e" stroke="#d4af37" stroke-width="1" />
  <text x="635" y="258" fill="#d4af37" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Release Compilation</text>
  <text x="635" y="280" fill="#38bdf8" font-family="monospace" font-size="11">npm run tauri build</text>
  <text x="635" y="300" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Bundles web assets into binary</text>
  <text x="635" y="318" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Full LTO optimization pass</text>
  <text x="635" y="336" fill="#d4af37" font-family="system-ui, sans-serif" font-size="10">• Strips debugging symbols</text>

  <rect x="625" y="370" width="245" height="250" rx="8" fill="#0b111e" stroke="#38bdf8" stroke-width="1" />
  <text x="635" y="393" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Automated Packaging</text>
  <text x="635" y="415" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Generates NSIS Installer (.exe)</text>
  <text x="635" y="433" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Embeds high-res app icon</text>
  <text x="635" y="451" fill="#d4af37" font-family="system-ui, sans-serif" font-size="10">• Optional Code-Signing cert</text>
  <text x="635" y="469" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Sets bundle identifier</text>
  <text x="635" y="487" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Windows SmartScreen ready</text>
  <text x="635" y="515" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Compilation Time: ~2 minutes</text>
  <text x="635" y="535" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">Produces single ultra-compact</text>
  <text x="635" y="555" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">standalone Windows installer.</text>

  <!-- Step 4 -->
  <rect x="905" y="135" width="265" height="505" rx="14" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="1.8" />
  <rect x="920" y="150" width="120" height="22" rx="11" fill="rgba(212,175,55,0.18)" />
  <text x="980" y="165" fill="#d4af37" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">STEP 04 // DEPLOY</text>
  <text x="920" y="195" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Production Output</text>
  <text x="920" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Finished Standalone Binary</text>

  <rect x="915" y="235" width="245" height="120" rx="8" fill="#0b111e" stroke="#38bdf8" stroke-width="1" />
  <text x="925" y="258" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Generated Binary Path</text>
  <text x="925" y="278" fill="#94a3b8" font-family="monospace" font-size="9">target/release/bundle/nsis/</text>
  <text x="925" y="296" fill="#38bdf8" font-family="monospace" font-size="10.5">CommandCenter_x64.exe</text>
  <text x="925" y="318" fill="#d4af37" font-family="system-ui, sans-serif" font-size="10">• Self-contained single-file .exe</text>
  <text x="925" y="336" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Zero Node or Python required</text>

  <rect x="915" y="370" width="245" height="250" rx="8" fill="#0b111e" stroke="#d4af37" stroke-width="1" />
  <text x="925" y="393" fill="#d4af37" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Commercial Distribution</text>
  <text x="925" y="415" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Give to team members or clients</text>
  <text x="925" y="433" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Double-click runs immediately</text>
  <text x="925" y="451" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10">• Works 100% offline on Windows</text>
  <text x="925" y="469" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Low RAM &lt;40MB consumption</text>
  <text x="925" y="495" fill="#d4af37" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">14-Day Guided Setup Support</text>
  <text x="925" y="515" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9.5">Up to 8 Architecture &amp; .EXE</text>
  <text x="925" y="535" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9.5">Build Questions Answered</text>
  <text x="925" y="555" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9.5">Directly via Priority Email</text>
</svg>