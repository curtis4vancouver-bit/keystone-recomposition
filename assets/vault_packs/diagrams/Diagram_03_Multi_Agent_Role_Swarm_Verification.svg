<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#04070d" />
  <rect x="15" y="15" width="1170" height="645" rx="16" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.85" />
  <rect x="18" y="18" width="1164" height="639" rx="14" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" />

  <!-- Top Header Banner -->
  <rect x="35" y="30" width="1130" height="85" rx="12" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="1.5" />
  <rect x="50" y="42" width="220" height="24" rx="12" fill="rgba(212,175,55,0.15)" stroke="#d4af37" stroke-width="1" />
  <text x="160" y="58" fill="#d4af37" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">TIER 02 // $199.00 USD SUITE</text>
  <text x="50" y="92" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Multi-Agent Role Swarm &amp; Deterministic QA Verification Gate</text>
  <text x="1150" y="78" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="end">4 Specialized Roles + 3-Source Fact Gate</text>

  <!-- 4 Specialized Role Columns -->
  <!-- Role 1: Researcher -->
  <rect x="35" y="135" width="265" height="505" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="55" y="165" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">ROLE 01 // RESEARCHER</text>
  <text x="55" y="185" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">3-Source Fact Scout</text>
  <text x="55" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Pre-Production Fact Gathering</text>

  <rect x="45" y="225" width="245" height="120" rx="8" fill="#0b111e" stroke="#d4af37" stroke-width="1" />
  <text x="55" y="248" fill="#d4af37" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">3-Tier Verification Gate</text>
  <text x="55" y="268" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Queries official docs &amp; specs</text>
  <text x="55" y="286" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Banned: Generic SEO fluff</text>
  <text x="55" y="304" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10">• Requires &gt;=3 authoritative sources</text>
  <text x="55" y="322" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Extracts 5 highest-impact points</text>

  <rect x="45" y="360" width="245" height="260" rx="8" fill="#0b111e" stroke="#38bdf8" stroke-width="1" />
  <text x="55" y="383" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Deliverable: Research Brief</text>
  <text x="55" y="405" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Saved to 02_Video_Prompts/</text>
  <text x="55" y="423" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Formatted as clean markdown</text>
  <text x="55" y="441" fill="#d4af37" font-family="system-ui, sans-serif" font-size="10">• 10-Scene Conceptual Outline</text>
  <text x="55" y="459" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Verified Stats &amp; Source URLs</text>
  <text x="55" y="485" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">"Zero Hallucination Rule"</text>
  <text x="55" y="505" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">Passes verified data directly</text>
  <text x="55" y="523" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">to Role 02 Writer with no</text>
  <text x="55" y="541" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">context loss or noise.</text>

  <!-- Role 2: Writer -->
  <rect x="325" y="135" width="265" height="505" rx="14" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="1.8" />
  <text x="345" y="165" fill="#d4af37" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">ROLE 02 // WRITER</text>
  <text x="345" y="185" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Script &amp; Article Master</text>
  <text x="345" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Synchronized Media Production</text>

  <rect x="335" y="225" width="245" height="120" rx="8" fill="#0b111e" stroke="#38bdf8" stroke-width="1" />
  <text x="345" y="248" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Google Flow Video Script</text>
  <text x="345" y="268" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Strictly 18-24 Words/10s Clip</text>
  <text x="345" y="286" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Word Count Printed in Brackets</text>
  <text x="345" y="304" fill="#d4af37" font-family="system-ui, sans-serif" font-size="10">• 3-Chip Invariant on Every Line</text>
  <text x="345" y="322" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• 5 Companion B-Roll Descriptions</text>

  <rect x="335" y="360" width="245" height="260" rx="8" fill="#0b111e" stroke="#d4af37" stroke-width="1" />
  <text x="345" y="383" fill="#d4af37" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Luxury Gutenberg Article</text>
  <text x="345" y="405" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• 1,200-Word In-Depth Guide</text>
  <text x="345" y="423" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• 16:9 YouTube Embed Header</text>
  <text x="345" y="441" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10">• 18px Comparison Matrix Table</text>
  <text x="345" y="459" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• FAQ Accordion + JSON-LD</text>
  <text x="345" y="485" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">"Dual Synchronous Production"</text>
  <text x="345" y="505" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">Video clips and written</text>
  <text x="345" y="523" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">website copy share the exact</text>
  <text x="345" y="541" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">same terminology and quotes.</text>

  <!-- Role 3: QA Auditor -->
  <rect x="615" y="135" width="265" height="505" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="635" y="165" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">ROLE 03 // QA AUDITOR</text>
  <text x="635" y="185" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Code &amp; Quality Gate</text>
  <text x="635" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Pre-Publishing Gatekeeper</text>

  <rect x="625" y="225" width="245" height="120" rx="8" fill="#0b111e" stroke="#d4af37" stroke-width="1" />
  <text x="635" y="248" fill="#d4af37" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">4-Point Automatic Audit</text>
  <text x="635" y="268" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• 1. Audio Pacing: 18-24w count</text>
  <text x="635" y="286" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• 2. Token Check: #04070d &amp; #d4af37</text>
  <text x="635" y="304" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10">• 3. Mobile Check: overflow-x wrap</text>
  <text x="635" y="322" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• 4. Tag Stack: 440-480 characters</text>

  <rect x="625" y="360" width="245" height="260" rx="8" fill="#0b111e" stroke="#38bdf8" stroke-width="1" />
  <text x="635" y="383" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Anti-Regression Sentinel</text>
  <text x="635" y="405" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Automatically rewrites lines</text>
  <text x="635" y="423" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">  exceeding 24 spoken words</text>
  <text x="635" y="441" fill="#d4af37" font-family="system-ui, sans-serif" font-size="10">• Enforces 9999px pill buttons</text>
  <text x="635" y="459" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Validates JSON-LD syntax</text>
  <text x="635" y="485" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">"Zero-Fluff Enforcement"</text>
  <text x="635" y="505" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">Blocks sloppy drafts and</text>
  <text x="635" y="523" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">unpaced scripts before they</text>
  <text x="635" y="541" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">reach Google Flow or web.</text>

  <!-- Role 4: Outreach Specialist -->
  <rect x="905" y="135" width="265" height="505" rx="14" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="1.8" />
  <text x="925" y="165" fill="#d4af37" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">ROLE 04 // OUTREACH</text>
  <text x="925" y="185" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">B2B Lead Closer</text>
  <text x="925" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Verified Partner Acquisition</text>

  <rect x="915" y="225" width="245" height="120" rx="8" fill="#0b111e" stroke="#38bdf8" stroke-width="1" />
  <text x="925" y="248" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">DNS/MX Lead Gate</text>
  <text x="925" y="268" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Verifies recipient MX records</text>
  <text x="925" y="286" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Banned: Generic info@ / desks</text>
  <text x="925" y="304" fill="#d4af37" font-family="system-ui, sans-serif" font-size="10">• Targets named decision-makers</text>
  <text x="925" y="322" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Protects sender domain health</text>

  <rect x="915" y="360" width="245" height="260" rx="8" fill="#0b111e" stroke="#d4af37" stroke-width="1" />
  <text x="925" y="383" fill="#d4af37" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Locked-Logo HTML Template</text>
  <text x="925" y="405" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Top Header Logo Banner</text>
  <text x="925" y="423" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Dark-Luxury Card Body</text>
  <text x="925" y="441" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10">• 9999px Gold Pill CTA Link</text>
  <text x="925" y="459" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">• Executive Signature Footer</text>
  <text x="925" y="485" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">"High-Trust Conversion"</text>
  <text x="925" y="505" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">Turns cold outreach into</text>
  <text x="925" y="523" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">high-ticket partnerships</text>
  <text x="925" y="541" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10">and corporate retainers.</text>
</svg>